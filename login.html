<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Tech Store</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --input: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .users-help {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .error {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1 class="title">Iniciar sesión</h1>
    <p class="subtitle">Accede como comprador o administrador</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="usuario@demo.com" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="********" required />
      </div>

      <button type="submit" class="login-btn">Entrar</button>
      <p class="error" id="errorMsg"></p>
    </form>

    <div class="users-help">
      <strong>Usuarios de prueba:</strong><br />
      Comprador: comprador@demo.com / 123456<br />
      Administrador: admin@demo.com / admin123
    </div>
  </main>

  <script>
    const users = [
      { email: "comprador@demo.com", password: "123456", role: "buyer" },
      { email: "admin@demo.com", password: "admin123", role: "admin" }
    ];

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const user = users.find(
        (item) => item.email === email && item.password === password
      );

      if (!user) {
        errorMsg.textContent = "Credenciales incorrectas. Intenta nuevamente.";
        return;
      }

      localStorage.setItem("sessionUser", JSON.stringify(user));
      window.location.href = "productos.html";
    });
  </script>
</body>
</html>
